# ── nginx.conf — Reverse proxy + static-file server (HTTP + HTTPS) ────────────
#
# Traffic flow
# ──────────────────────────────────────────────────────────────────
#   Browser ──HTTP:80──► redirect to HTTPS
#   Browser ──HTTPS:443──► nginx
#                            │
#                            ├─ /static/**  served directly from /srv/static
#                            ├─ /ws/**      WebSocket upgrade → backend:8000
#                            └─ /**         FastAPI → backend:8000
#
# Before deploying:
#   1. Replace every occurrence of YOUR_DOMAIN_HERE with your actual domain.
#   2. Run: certbot certonly --nginx -d YOUR_DOMAIN_HERE
#   3. Restart nginx.

upstream drone_backend {
    server backend:8000;
    keepalive 32;
}

limit_req_zone  $binary_remote_addr zone=api:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ws:10m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_HERE;

    # Certificates managed by Certbot (run: certbot certonly --nginx -d YOUR_DOMAIN_HERE)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Static assets ──────────────────────────────────────────────────────────
    location /static/ {
        alias /srv/static/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        gzip_static on;
    }

    # ── WebSocket — must use wss:// when behind TLS ────────────────────────────
    location /ws/ {
        limit_conn ws 5;
        proxy_pass         http://drone_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout    5s;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass         http://drone_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
    }

    # ── Everything else → FastAPI ─────────────────────────────────────────────
    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://drone_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/drone_access.log;
    error_log  /var/log/nginx/drone_error.log warn;
}
