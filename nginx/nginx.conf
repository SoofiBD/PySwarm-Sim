# ── nginx.conf — Reverse proxy + static-file server ──────────────────────────
#
# Traffic flow
# ──────────────────────────────────────────────────────────────────
#   Browser ──HTTP/WS──► nginx:80
#                          │
#                          ├─ /static/**  ──► served directly from /srv/static
#                          │               (no Python round-trip, max throughput)
#                          │
#                          ├─ /ws/**      ──► backend:8000  (WebSocket upgrade)
#                          │
#                          └─ /**         ──► backend:8000  (FastAPI)
#
# For TLS (HTTPS/WSS) on a VPS: use Certbot to obtain a Let's Encrypt cert
# and add an ssl server block that listens on 443 and redirects 80 → 443.

upstream drone_backend {
    server backend:8000;
    # keepalive — reuse TCP connections to the backend (reduces latency)
    keepalive 32;
}

# ── Rate limiting zones ───────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=api:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ws:10m;

server {
    listen 80;
    server_name _;                  # replace with your domain in production

    # ── Static assets — served directly by nginx ──────────────────────────────
    location /static/ {
        alias /srv/static/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        gzip_static on;
    }

    # ── WebSocket telemetry endpoint ──────────────────────────────────────────
    # RFC 6455 upgrade handshake requires these specific headers.
    location /ws/ {
        limit_conn ws 5;            # max 5 concurrent WS connections per IP

        proxy_pass         http://drone_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket connections are long-lived; raise timeouts accordingly.
        proxy_read_timeout    86400s;   # 24 h — prevent premature teardown
        proxy_send_timeout    86400s;
        proxy_connect_timeout    5s;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=60 nodelay;

        proxy_pass         http://drone_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";            # enable keepalive
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
    }

    # ── Everything else → FastAPI (serves index.html etc.) ───────────────────
    location / {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://drone_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/drone_access.log;
    error_log  /var/log/nginx/drone_error.log warn;
}
