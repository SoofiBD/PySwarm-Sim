version: "3.9"

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Python / FastAPI simulation backend ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      # Tune these to match your VPS CPU/memory
      UVICORN_WORKERS: "2"
    # Backend is NOT exposed directly on the host; nginx is the only ingress.
    expose:
      - "8000"
    networks:
      - drone_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 15s
      timeout:  5s
      retries:  3
      start_period: 10s
    # Resource limits — adjust to your VPS specs
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "512M"

  # ── nginx reverse proxy + static file server ─────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment for TLS once you have a cert via Certbot:
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Static JS/CSS/images served directly — zero Python overhead
      - ./map/static:/srv/static:ro
      # Certbot managed certs (uncomment when using TLS):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - drone_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "64M"

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  drone_net:
    driver: bridge
