[project]
name = "python-drone"
version = "0.1.0"
description = "Heterogeneous Flying Ad-hoc Networks (FANET) Test Environment"
authors = [
    {name = "SoofiBD", email = "burakduvakli@hotmail.com"}
]
# Core = what the FastAPI server needs (Dockerfile.backend installs exactly this list)
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
# PySide6 desktop UI (run.py)
desktop = [
    "PySide6>=6.0.0",
    "matplotlib>=3.7.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
packages = ["app", "server", "map"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app", "server"]
omit = ["tests/*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
