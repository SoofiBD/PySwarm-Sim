<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drone Swarm — Live Telemetry</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/newStyle.css') }}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
        #shell { display: flex; flex-direction: column; height: 100vh; }

        #topbar {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 16px; background: #161b22;
            border-bottom: 1px solid #30363d; flex-shrink: 0;
        }
        #topbar h1 { font-size: 15px; font-weight: 600; color: #58a6ff; letter-spacing: .5px; }
        #ws-status {
            margin-left: auto; font-size: 12px; padding: 2px 10px;
            border-radius: 10px; background: #21262d; border: 1px solid #30363d;
        }
        #ws-status.ok  { border-color: #3fb950; color: #3fb950; }
        #ws-status.err { border-color: #f85149; color: #f85149; }

        #content { display: flex; flex: 1; overflow: hidden; }
        #map { flex: 1; }

        #sidebar {
            width: 220px; background: #161b22; border-left: 1px solid #30363d;
            overflow-y: auto; padding: 12px; flex-shrink: 0;
            display: flex; flex-direction: column; gap: 10px;
        }
        #sidebar h2 { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: .8px; }
        .stat-card {
            background: #21262d; border-radius: 6px; padding: 8px 10px;
            border: 1px solid #30363d; font-size: 12px;
        }
        .stat-card .label { color: #8b949e; margin-bottom: 2px; }
        .stat-card .value { font-size: 18px; font-weight: 700; color: #58a6ff; }

        #legend { display: flex; flex-direction: column; gap: 6px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    </style>
</head>
<body>
<div id="shell">
    <div id="topbar">
        <h1>&#9650; Drone Swarm — Live Telemetry</h1>
        <span id="ws-status">Connecting…</span>
    </div>
    <div id="content">
        <div id="map"></div>
        <div id="sidebar">
            <h2>Overview</h2>
            <div class="stat-card">
                <div class="label">Active Drones</div>
                <div class="value" id="stat-drones">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Targets Remaining</div>
                <div class="value" id="stat-targets">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Avg Speed (m/s)</div>
                <div class="value" id="stat-speed">—</div>
            </div>

            <h2 style="margin-top:6px">Legend</h2>
            <div id="legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background:#1a73e8"></div>
                    <span>Drone (Leader)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#00CC44"></div>
                    <span>Target — Free</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#f9a825"></div>
                    <span>Target — Visiting</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#d32f2f"></div>
                    <span>Target — Visited</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#00CC44"></div>
                    <span>Link — in range</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#FF4444"></div>
                    <span>Link — near limit</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Real-time map logic (no jQuery, no static JSON polling) -->
<script src="{{ url_for('static', path='js/realtime_map.js') }}"></script>

<!-- Sidebar stats wired into the WebSocket message handler -->
<script>
(function () {
    const origOnMessage = window._wsMessageHook;  // extension point if needed
    const statDrones  = document.getElementById("stat-drones");
    const statTargets = document.getElementById("stat-targets");
    const statSpeed   = document.getElementById("stat-speed");
    const wsStatus    = document.getElementById("ws-status");

    // Patch the status indicator once WebSocket state is known
    const _patchStatus = setInterval(() => {
        if (typeof ws === "undefined") return;
        clearInterval(_patchStatus);
        const _origOpen  = ws.onopen;
        const _origClose = ws.onclose;
        ws.addEventListener("open",  () => { wsStatus.textContent = "Live"; wsStatus.className = "ok"; });
        ws.addEventListener("close", () => { wsStatus.textContent = "Reconnecting…"; wsStatus.className = "err"; });
        ws.addEventListener("message", (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type !== "telemetry") return;
            statDrones.textContent  = msg.drones.length;
            const free = msg.targets.filter(t => t.state !== "Visited").length;
            statTargets.textContent = free;
            if (msg.drones.length > 0) {
                const avg = msg.drones.reduce((s, d) => s + d.speed, 0) / msg.drones.length;
                statSpeed.textContent = avg.toFixed(1);
            }
        });
    }, 100);
})();
</script>

<!-- Google Maps — callback=initMap triggers realtime_map.js -->
<script async defer
    src="https://maps.googleapis.com/maps/api/js?key={{ maps_api_key }}&callback=initMap">
</script>
</body>
</html>
